<html>
    <head>
        <title>My Hobby Cards</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <!--STEP 1 - Bootstrap CSS link-->
        <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"

        <style> 
            <body{
                background-color:#f9f9f9;
                font-family: Arial, sans-serif;
                padding: 30px 15px;
            }
            h1{
                text-align: center; 
                color: #ffa43f;

            }

            .hobby-card {
                text-align: center;
                border: 2px solid #ffa43f;
                border-radius: 8px; 
                padding: 20px;
                margin-bottom: 20px;
                background-color: #fff8e1;
            }
            .hobby-card h3{
                color: #ffa43f
            }
        
        </style>
    </head>
    <body>
        <h1>My Hobby Cards</h1>
        <!--STEP 2 - container keeps the layout neat and centered -->
        <div class="container">
            <!--STEP 3 - row holds all the columns in one horizontal line-->
            <div class="row">
                <!--STEP 4 - col-12: full width on phones
                col-md 6: half width on tablets
                col-lg-4: one third on desktops-->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Videogames</h3>
                    <p>I love playing videogames with my friends</p>

        
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Reading</h3>
                    <p>I enjoy reading books and articles on various topics.</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Traveling</h3>
                    <p>I love exploring new places and cultures around the world.</p>
                </div>
                </div>
            
            </div>
        </div>
        
        <!--STEP 5 - Bootstrap JS link (optional for interactive components)-->
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>


    </body>
</html>

<html>
<head>
    <title>My Animal Fact File</title>
    <style>
        /*Page Background- sets the color and font for the whole page*/
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }
        
        /* Box Model - width sets the content area
        padding pushes the text away from the edges
        border draws a visible frame around the fact file
        margin pushes the fact file away from the screen edge */
        .fact-file {
            background-color:rgba(255, 222, 173, 0.751);
            color: rgba(245, 245, 220, 0.589);
            width: 260px;
            padding: 25px;
            border: 4px solid rgba(255, 235, 205, 0.614);
            margin: 10px;   
        }

        /*Animal name - blanchealmond so it stands out */
        .animal name{
            color:rgba(255, 235, 205, 0.235);
            font-size: 22px;
            font-weight: bold;
        }
        

        /*Detail rows- a little dark text on the light background*/
        .detail {
            color:rgba(255, 240, 245, 0.747);
            
        }

        /*Cool fact - orange and italic to make it feel special */
        .cool-fact { 
            color:cornflowerblue;
            font-style: italic;
        }

    </style>
</head>
<body>

    <div class="fact-file">
        <h2 class="animal-name">Snow leopard</h2>
        <p class="detail">Type: Big Cat.</p>
        <p class="detail">Habitat: Mountainous regions of Central and South Asia.</p>
        <p class="detail">Diet: Carnivore, primarily preys on blue sheep and ibex.</p>
        <p class="detail">Lifespan: Approximately 15-18 years in the wild.</p>
        <p class="cool-fact"> Cool Fact: Can leap up to 20 feet in a single bound.</p>
    </div>
</body>
</html>
